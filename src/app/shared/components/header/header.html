<header class="header-container">
  <div class="header-left">
    <button mat-icon-button class="menu-button" (click)="onToggleSidebar()" aria-label="Toggle sidebar">
      <mat-icon>{{ isSidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
    </button>

    <div class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-copy">
        <strong>Vinevault</strong>
        <span>Secure overview</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <button
      *ngIf="effectivePlan() === 'FREE'; else premiumPill"
      mat-flat-button
      class="upgrade-button"
      (click)="openCheckout()"
    >
      <mat-icon>workspace_premium</mat-icon>
      Actualizar a Premium
    </button>
    
    <ng-template #premiumPill>
      <span
        class="status-pill premium-active"
        (dblclick)="resetSubscription()"
        title="Doble clic para restablecer a GRATIS"
      >
        <mat-icon class="pill-icon">workspace_premium</mat-icon>
        Premium Mode
      </span>
    </ng-template>
  </div>
</header>
