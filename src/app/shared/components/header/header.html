<header class="header-container" [class.with-workspace]="showWorkspaceSwitcher">
  <div class="header-left">
    <button type="button" mat-icon-button class="menu-button" (click)="onToggleSidebar()" [attr.aria-label]="'Toggle sidebar' | t" [attr.aria-expanded]="isSidebarOpen">
      <mat-icon>{{ isSidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
    </button>

    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="26" viewBox="0 0 28 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h14l1 9a8 8 0 0 1-16 0l1-9ZM14 21v8M9 29h10M6 11c5-3 11 3 16 0" />
        </svg>
      </div>
      <div class="brand-copy">
        <strong>VineVault</strong>
        <span>{{ 'Secure overview' | t }}</span>
      </div>
    </div>
    <app-workspace-switcher *ngIf="showWorkspaceSwitcher"></app-workspace-switcher>
  </div>

</header>
