<div class="ai-analysis-wrapper">
  <!-- Header / Action Section -->
  <div class="ai-actions-row">
    <button
      type="button"
      class="ai-analyze-btn"
      [disabled]="loading || !wineCellarId"
      (click)="runAnalysis()"
    >
      <span class="btn-content">
        <mat-spinner *ngIf="loading" diameter="16" strokeWidth="2" class="btn-spinner"></mat-spinner>
        <svg *ngIf="!loading" class="ai-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z" />
        </svg>
        <span>{{ loading ? 'Analyzing…' : 'Analyze with AI' }}</span>
      </span>
    </button>
  </div>

  <!-- Loading State (Skeleton Loader) -->
  <div *ngIf="loading" class="skeleton-container" role="status">
    <div class="skeleton-text-row">
      <mat-spinner diameter="20" strokeWidth="2.5" class="skeleton-spinner"></mat-spinner>
      <span class="skeleton-message">VineVault's AI sommelier is analyzing your inventory…</span>
    </div>
    <div class="skeleton-lines" aria-hidden="true">
      <div class="skeleton-line h1"></div>
      <div class="skeleton-line body-1"></div>
      <div class="skeleton-line body-2"></div>
      <div class="skeleton-line body-3"></div>
      <div class="skeleton-line h2"></div>
      <div class="skeleton-line body-1"></div>
      <div class="skeleton-line body-2"></div>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="error-container" role="alert">
    <svg class="error-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3 2 21h20L12 3Z" /><path d="M12 9v5m0 3v1" /></svg>
    <div class="error-details">
      <p class="error-message">{{ error }}</p>
      <button type="button" class="error-retry-btn" (click)="runAnalysis()">Retry</button>
    </div>
  </div>

  <!-- Success State (Glassmorphism Result) -->
  <div *ngIf="analysisResult && !loading && !error" class="glass-container">
    <div class="glass-header">
      <div class="glass-title">
        <span aria-hidden="true">🍷</span>
        <span>AI sommelier analysis</span>
      </div>
      <div class="glass-meta">
        <span>Tokens used: {{ analysisResult.tokensUsed }}</span>
        <span class="meta-divider">•</span>
        <span>{{ analysisResult.createdAt | date:'short' }}</span>
      </div>
    </div>
    
    <div class="markdown-content" [innerHTML]="analysisResult.content | markdown"></div>
  </div>
</div>
