<div *ngIf="space" class="detail-header">
  <div class="detail-title">
    <h1>{{ space.name }}</h1>
    <p class="subtitle">Cavas del espacio</p>
    <p *ngIf="space.quotas as quota" class="subtitle">Cavas: {{ quota.cellars.used }} / {{ quota.cellars.limit === null ? 'Sin límite' : quota.cellars.limit }} · {{ quota.cellars.remaining === null ? 'Sin límite' : quota.cellars.remaining }} disponibles</p>
  </div>
  <div class="detail-actions">
    <button *appCan="'CONFIGURE'" mat-fab class="action-button action-button--primary" type="button" [disabled]="!canCreate(space)" (click)="requestCreateCava()" aria-label="Nueva cava" title="Crear cava (requiere cupo disponible)">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
