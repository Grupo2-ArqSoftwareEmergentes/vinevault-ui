<div class="page-layout">
  <app-header [showWorkspaceSwitcher]="true" [isSidebarOpen]="isSidebarOpen" (sidebarToggleRequested)="toggleSidebar()"></app-header>

  <div class="page-body">
    <app-sidebar [isOpen]="isSidebarOpen" (closeRequested)="closeSidebar()"></app-sidebar>

    <main class="content">
      <div class="workspace">
        <section class="detail-panel">
          <div *ngIf="!selectedSpace" class="empty-state centered">
            Select a space from the workspace selector in the top bar to view cellars.
          </div>

          <ng-container *ngIf="selectedSpace">
            <app-space-detail-cava-header
              [space]="selectedSpace"
              (createCavaRequested)="openCreateWineCellarDialog()"
            ></app-space-detail-cava-header>

            <div *ngIf="loadingWineCellars" class="state-row" role="status">
              <mat-spinner diameter="22"></mat-spinner>
              <span>Cargando cavas...</span>
            </div>

            <div *ngIf="errorWineCellars && !loadingWineCellars" class="state-row error" role="alert">{{ errorWineCellars }}</div>

            <div *ngIf="!loadingWineCellars && wineCellars.length === 0" class="state-row state-row--empty">
              No hay cavas registradas en este espacio.
            </div>

            <div *ngIf="!loadingWineCellars && wineCellars.length > 0" class="cava-list">
              <article
                *ngFor="let cellar of wineCellars; trackBy: trackByCellarId"
                class="cava-card"
                [class.selected]="selectedWineCellarId === cellar.id.value"
                (click)="selectWineCellar(cellar)"
              >
                <div class="cava-main">
                  <div class="cava-copy">
                    <h2>
                      <button class="cava-select" type="button" [attr.aria-expanded]="selectedWineCellarId === cellar.id.value" (click)="selectWineCellar(cellar); $event.stopPropagation()">{{ cellar.name }}</button>
                    </h2>
                    <p>{{ cellar.description || 'Sin descripción' }}</p>
                  </div>
                  <div class="device-status-block">
                    <span class="device-pill" [class.device-pill--linked]="cellar.deviceId">
                      {{ linkedDeviceName(cellar) }}
                    </span>
                    <span class="device-metrics" *ngIf="cellar.deviceId">
                      {{ linkedDeviceMetricsLabel(cellar) }}
                    </span>
                  </div>
                </div>

                <div class="cava-actions" *ngIf="selectedWineCellarId === cellar.id.value">
                  <button class="cava-action cava-action--inventory" type="button" (click)="openInventoryForWineCellar(cellar); $event.stopPropagation()">
                    Inventario
                  </button>
                  <button *appCan="'CONFIGURE'" class="cava-action" type="button" (click)="openEditWineCellarDialog(cellar); $event.stopPropagation()">
                    Editar
                  </button>
                  <button *appCan="'CONFIGURE'" class="cava-action cava-action--delete" type="button" (click)="deleteWineCellar(cellar); $event.stopPropagation()">
                    Eliminar
                  </button>
                </div>
              </article>
            </div>
          </ng-container>
        </section>
      </div>
    </main>
  </div>
</div>
