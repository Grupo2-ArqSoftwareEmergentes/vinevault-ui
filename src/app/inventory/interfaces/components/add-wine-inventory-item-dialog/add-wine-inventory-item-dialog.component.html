<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Wine name</mat-label>
      <input matInput formControlName="wineName" placeholder="Malbec Reserva" />
      <mat-error *ngIf="form.get('wineName')?.hasError('required')">Wine name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Wine type</mat-label>
      <input matInput formControlName="wineType" placeholder="Tinto" />
      <mat-error *ngIf="form.get('wineType')?.hasError('required')">Wine type is required</mat-error>
    </mat-form-field>

    <div class="grid">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Age years</mat-label>
        <input matInput type="number" formControlName="ageYears" min="0" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" formControlName="quantity" min="1" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="submit()">{{ data.submitLabel }}</button>
</mat-dialog-actions>
