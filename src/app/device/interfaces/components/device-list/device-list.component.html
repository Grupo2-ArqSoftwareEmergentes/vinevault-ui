<div *ngIf="selectedSpace" class="view-toggle">
  <button mat-button type="button" [class.active]="viewMode === 'grid'" [attr.aria-pressed]="viewMode === 'grid'" (click)="setViewMode('grid')" [attr.aria-label]="'Grid view' | t">
    <mat-icon>grid_view</mat-icon>
    {{ 'Grid' | t }}
  </button>
  <button mat-button type="button" [class.active]="viewMode === 'list'" [attr.aria-pressed]="viewMode === 'list'" (click)="setViewMode('list')" [attr.aria-label]="'List view' | t">
    <mat-icon>view_list</mat-icon>
    {{ 'List' | t }}
  </button>
</div>

<div *ngIf="!selectedSpace && !loadingDevices" class="empty-state centered">
  <mat-icon aria-hidden="true">account_tree</mat-icon>
  {{ 'Select a space from the workspace selector in the top bar to view devices.' | t }}
</div>

<div *ngIf="loadingDevices" class="loading-state centered" role="status">
  <mat-spinner diameter="24"></mat-spinner>
  <span>{{ 'Loading devices...' | t }}</span>
</div>

<div *ngIf="errorDevices && !loadingDevices" class="error-state centered" role="alert">{{ errorDevices | t }}</div>

<div *ngIf="!loadingDevices && devicesPage && devicesPage.content.length === 0" class="empty-state centered">
  <mat-icon aria-hidden="true">sensors</mat-icon>
  {{ 'No devices registered in this space.' | t }}
</div>

<div *ngIf="!loadingDevices && devicesPage && devicesPage.content.length > 0" [class.device-grid]="viewMode === 'grid'" [class.device-list]="viewMode === 'list'">
  <app-device-card
    *ngFor="let device of devicesPage.content; trackBy: trackByDeviceId"
    [device]="device"
    [viewMode]="viewMode"
    [canAssignCellar]="canAssignCellar"
    [telemetry]="telemetryByDeviceId[device.id.value] ?? null"
    (deviceSelected)="onDeviceSelected($event)"
    (cellarChangeRequested)="cellarChangeRequested.emit($event)"
  ></app-device-card>
</div>
