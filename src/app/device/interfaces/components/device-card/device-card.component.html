<!-- Grid view -->
<mat-card *ngIf="viewMode === 'grid'" class="device-card">
  <div class="card-header">
    <button type="button" class="badge cellar-button" [class.badge--unassigned]="!device.cellarName" [disabled]="!canAssignCellar" aria-haspopup="dialog" [attr.aria-label]="'Cambiar cava de {name}: {cellar}' | t:{name:device.name, cellar:device.cellarName || ('Sin cava' | t)}" (click)="changeCellar($event)"><span>{{ device.cellarName || ('Sin cava' | t) }}</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 8 5 5 5-5" /></svg></button>
    <mat-icon class="signal-icon" [style.color]="connectivityIndicatorColor()">signal_cellular_alt</mat-icon>
  </div>
  <div class="card-body">
    <h3 class="device-name">{{ device.name }}</h3>
    <mat-icon class="status-icon" [style.backgroundColor]="powerIndicatorColor()" [attr.data-status]="connectionStatus()" aria-hidden="false" role="img" [attr.aria-label]="connectionLabel() | t" [title]="connectionLabel() | t">power_settings_new</mat-icon>
  </div>
  <div class="card-footer">
    <mat-icon class="footer-icon">history</mat-icon>
    <span class="footer-text">{{ 'Updated' | t }} {{ getUpdatedAtValue() | localizedDate:'short' }}</span>
    <button mat-icon-button class="go-button" (click)="onDeviceClick()" [attr.aria-label]="'Go to device' | t">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</mat-card>

<!-- List view -->
<div *ngIf="viewMode === 'list'" class="device-list-item">
  <div class="list-main">
    <button type="button" class="badge cellar-button" [class.badge--unassigned]="!device.cellarName" [disabled]="!canAssignCellar" aria-haspopup="dialog" [attr.aria-label]="'Cambiar cava de {name}: {cellar}' | t:{name:device.name, cellar:device.cellarName || ('Sin cava' | t)}" (click)="changeCellar($event)"><span>{{ device.cellarName || ('Sin cava' | t) }}</span><svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 8 5 5 5-5" /></svg></button>
    <div class="list-name-row">
      <span class="list-name">{{ device.name }}</span>
      <mat-icon class="status-icon" [style.backgroundColor]="powerIndicatorColor()" [attr.data-status]="connectionStatus()" aria-hidden="false" role="img" [attr.aria-label]="connectionLabel() | t" [title]="connectionLabel() | t">power_settings_new</mat-icon>
    </div>
  </div>
  <div class="list-meta">
    <mat-icon class="footer-icon">history</mat-icon>
    <span class="list-date">{{ 'Updated' | t }} {{ getUpdatedAtValue() | localizedDate:'short' }}</span>
    <button mat-icon-button class="go-button" (click)="onDeviceClick()" [attr.aria-label]="'Go to device' | t">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
