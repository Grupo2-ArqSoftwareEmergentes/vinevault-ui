<h2 mat-dialog-title>{{ 'Add Organization' | t }}</h2>
<mat-dialog-content>
  <p class="description">{{ 'Organize your wine cellars and manage their spaces in one place.' | t }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'Organization Name' | t }}</mat-label>
      <input matInput formControlName="name" [attr.placeholder]="'Enter organization name' | t" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">{{ 'Name is required' | t }}</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="dialog-button" type="button" (click)="cancel()">{{ 'Cancel' | t }}</button>
  <button class="dialog-button dialog-button--primary" type="button" [disabled]="form.invalid" (click)="submit()">{{ 'Create' | t }}</button>
</mat-dialog-actions>
