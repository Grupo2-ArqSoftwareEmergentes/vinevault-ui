<h2 mat-dialog-title>{{ 'Claim Sensor' | t }}</h2>
<mat-dialog-content>
  <p class="description">{{ 'Enter the claim token from the sensor label or QR code.' | t }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'Claim Token' | t }}</mat-label>
        <input matInput formControlName="claimToken" placeholder="AB45-F3B1" autocomplete="off" />
        <mat-error *ngIf="form.get('claimToken')?.hasError('required')">{{ 'Claim token is required' | t }}</mat-error>
        <mat-error *ngIf="form.get('claimToken')?.hasError('pattern')">{{ 'Invalid claim token format' | t }}</mat-error>
      </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'Cancel' | t }}</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="submit()">{{ 'Claim' | t }}</button>
</mat-dialog-actions>
